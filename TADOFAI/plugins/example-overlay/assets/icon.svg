<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Example Overlay">
  <!-- ADOFAI 的星球：外圈轨道 + 中心行星 + 一颗卫星 -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ea8ff"/>
      <stop offset="1" stop-color="#7ef0d0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd8ff"/>
    </linearGradient>
  </defs>

  <!-- 轨道 -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- 中心行星 -->
  <circle cx="32" cy="32" r="10" fill="url(#core)"/>

  <!-- 卫星 -->
  <circle cx="32" cy="7" r="4" fill="#7ef0d0"/>
</svg>
